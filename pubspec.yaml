name: nexus_calc
description: NEXUS is a mobile-first scientific calculator for Android and iOS built with Flutter.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  math_expressions: ^2.4.0
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  flutter_animate: ^4.5.0
  vibration: ^1.8.4
  gap: ^3.0.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
